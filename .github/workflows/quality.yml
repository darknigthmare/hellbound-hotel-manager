name: Quality gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check, test and build
        run: npm run qa

      - name: Upload verified standalone bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: infernal-versus-standalone
          path: dist-combat/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

